[package]
name = "particles-demo"
version = "0.1.0"
edition = "2024"
description = "Interactive particle fountain demo built with Rust and wgpu"
license = "MIT"
readme = "README.md"
rust-version = "1.87"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.4", features = ["derive"] }
glam = "0.33.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rand = "0.10.2"
wgpu = "30.0.0"
winit = "0.30.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
